[project]
name = "petroglifos-llm"
version = "0.1.0"
description = "Sistema multiagente para clasificación taxonómica de petroglifos andinos colombianos"
requires-python = ">=3.11"
dependencies = [
    # API & servidor
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # Validación y configuración
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LangGraph + LangChain
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-google-genai>=1.0",
    "langchain-community>=0.2",
    # Google Gemini
    "google-generativeai>=0.7",
    # Base de datos
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Documentos y RAG
    "jinja2>=3.1",
    "weasyprint>=62",
    "pytesseract>=0.3",
    "pypdf>=4.0",
    "pdf2image>=1.17",               # OCR de páginas escaneadas en PDFs (requiere poppler-utils en OS)
    # Visión computacional
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.0",          # YOLOv8
    "timm>=0.9",                  # EfficientNet-B0
    # Grafos sociales
    "networkx>=3.3",
    "pyvis>=0.3",
    "python-louvain>=0.16",        # PyPI: python-louvain → `from community import best_partition`
    # HTTP y async
    "httpx>=0.27",
    "tenacity>=8.3",              # retry con backoff exponencial
    # Telegram Bot
    "python-telegram-bot>=21.0",
    # Colas de tareas
    "celery>=5.4",
    "redis>=5.0",
    # Utils
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "B904"]

[tool.mypy]
strict = false
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]