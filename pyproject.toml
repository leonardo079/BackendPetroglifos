[project]
name = "petroglifos-llm"
version = "0.1.0"
description = "Sistema multiagente para clasificación taxonómica de petroglifos andinos colombianos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.1",
    "langchain>=0.2",
    "langchain-google-genai>=1.0",
    "google-generativeai>=0.7",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "jinja2>=3.1",
    "weasyprint>=62",
    "pytesseract>=0.3",
    "pypdf>=4.0",
    "opencv-python>=4.9",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
