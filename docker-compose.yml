services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: petroglifos
      POSTGRES_USER: petro
      POSTGRES_PASSWORD: petro
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build: .
    command: uvicorn adapters.inbound.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]

volumes:
  pgdata:
