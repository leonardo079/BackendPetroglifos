services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: petroglifos
      POSTGRES_USER: petro
      POSTGRES_PASSWORD: petro
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petro -d petroglifos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn adapters.inbound.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    volumes: [".:/app", "./storage:/app/storage"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    command: celery -A infrastructure.messaging.celery_app worker --loglevel=info -c 2
    env_file: .env
    volumes: [".:/app", "./storage:/app/storage"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    command: python -m adapters.inbound.telegram_bot.bot
    env_file: .env
    environment:
      # Sobreescribe la URL para que el bot use el nombre del servicio Docker
      - API_BASE_URL=http://api:8000
    volumes: [".:/app", "./storage:/app/storage"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: